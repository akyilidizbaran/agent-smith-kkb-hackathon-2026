# Semantic series catalog — BDDK FinTürk (İllere Göre)
#
# Human-authored, reviewed, and versioned in Git. Nothing here is inferred from data.
# Every field must be traceable to docs/sources/bddk_finturk.md or to a committed fixture.
# See docs/catalog-contract.md for the field contract and validation rules.
#
# The unit was established on 2026-09-11 and is no longer null: BDDK's own table selector
# labels tabloNo=3 as "Bireysel Bankacılık (Bin TL)", and the 81-province sum for 2025-09
# reproduces the independently verified BDDK Aylık national total to within 0.001%. Both
# proofs are recorded in docs/sources/bddk_finturk.md.
#
# All 81 provinces from BDDK's own FinTürk province dropdown (fetched live 2026-09-10/11,
# not guessed) are listed here, one series per province, all pointing at the same verified
# table (tabloNo=3, Bireysel Bankacılık) and the same verified column (Konut Kredisi). The
# connector/parser are province-generic; only YALOVA was individually spot-checked live
# (docs/sources/bddk_finturk.md) before the rest were added on the strength of that same
# verified contract. If any province fails on first real ingestion, that failure will surface
# per-series (scripts/run_catalog_ingestion.py) without affecting the others.
#
# series_id uses an ASCII transliteration of the province name (validate_series_id forbids
# Turkish letters); native_code keeps BDDK's real Turkish spelling, which is what is actually
# sent on the wire (see ingestion_registry.py's _bddk_finturk_spec, which derives sehir from
# native_code, not from series_id). BddkFinTurkParser._slug applies the same transliteration
# at parse time so its derived series_id matches these entries.

catalog_schema_version: "1.0"
source_id: bddk_finturk

series:
  - series_id: bddk_finturk:ADANA_KonutKredisi
    native_code: ADANA_KonutKredisi
    dataset_id: bddk_finturk_adana_housing_loans
    name_tr: Konut Kredisi, ADANA (Bireysel Bankacılık, Sektör)
    description: >-
      BDDK FinTürk (İllere Göre), Bireysel Bankacılık tablosu (tabloNo=3), "Konut Kredisi"
      sütunu, ADANA ili, Sektör tarafı. Dönem sonu konut kredisi bakiyesidir (stok).
      FREKANS NÜANSI: kaynak çeyreklik yayınlanıyor (Mart/Haziran/Eylül/Aralık), aylık değil
      — bkz. docs/sources/bddk_finturk.md.
      BİRİM: Bin TL. Kaynağın kendi tablo seçicisi bu tabloyu "Bireysel Bankacılık
      (Bin TL)" diye etiketliyor (tabloNo=3) ve 81 ilin 2025-09 toplamı, bağımsız olarak
      doğrulanmış BDDK Aylık ulusal konut kredisi stokuyla %0,001 içinde örtüşüyor —
      bkz. docs/sources/bddk_finturk.md.
    aliases:
      - adana konut kredisi
      - adana konut kredisi bakiyesi
      - adana ili konut kredisi
    tags: [kredi, konut, bankacilik, bddk, stok, il]
    frequency: quarterly
    unit: TRY_th
    measure_type: stock
    default_agg: last
    semantic_confidence: verified
    semantic_source: source_docs
    metadata_url: https://www.bddk.org.tr/BultenFinTurk
    status: active

