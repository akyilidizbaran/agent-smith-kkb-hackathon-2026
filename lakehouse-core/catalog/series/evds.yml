# Semantic series catalog — EVDS (TCMB Electronic Data Delivery System)
#
# GENERATED (not hand-authored) by a targeted extension of scripts/evds_catalog_generator.py:
# instead of all 678 EVDS datagroups (53,792 series — far beyond this project's housing/
# mortgage scope, see docs/ mentor discussion), this file covers the 17 datagroups actually
# relevant to the theme (konut fiyat endeksleri, konut/tuketici kredisi faiz oranlari, TUFE
# for enflasyon adjustment). Every entry is semantic_confidence: derived, semantic_source:
# source_service — EVDS's own API declares name/frequency, no human reviewed each series
# individually. This still needs zero code changes to extend: ingestion_registry.py's
# _evds_spec already derives everything from native_code alone.
#
# Datagroups covered: bie_kfe, bie_ykfe, bie_yokfend, bie_akonutsat1-4, bie_birimfiyat, bie_bk,
# bie_ykke, bie_kt100h, bie_kt210a, bie_tukkre, bie_vdkre, bie_kbtukkre, bie_kybtkttk,
# bie_tukfiy2025.

