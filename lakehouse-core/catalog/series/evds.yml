      endeksiyle ilişkilendirir. Bu kanıt, güncel kimlik doğrulamalı EVDS3 API
      yanıtının doğrulandığı anlamına gelmez. Canlı yanıt ve güncel yayın durumu
      doğrulanmadığından semantic_confidence 'derived' olarak korunur;
      semantic_source 'source_docs' kamuya açık belge kanıtını belirtir.
      Farklı bazlı endeksler otomatik birleştirilmemeli; canlı uyumluluk
      doğrulanmadan üretim reel dönüşümlerinde kullanılmamalıdır.
