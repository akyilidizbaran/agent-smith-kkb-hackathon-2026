    name_tr: Konut Kredileri, Toplam (Sektör) - Haftalık
    description: >-
      BDDK Haftalık Bülten, Krediler tablosu, "a) Konut" kalemi, Toplam sütunu,
      Sektör tarafı. Haftalık konut kredisi bakiyesidir (stok): dönemler toplanmaz,
      daha düşük frekansa indirilirken dönemin son değeri alınır.
      TARİH NÜANSI: kaynak haftalıktır ve normal çapası Cuma'dır, ancak tatil
      haftalarında kaynağın gözlem tarihi Perşembe gibi başka bir güne kayabilir;
      canlı seride 13.03.2026 -> 19.03.2026 -> 27.03.2026 adımları görülmüştür
      (6 gün, sonra 8 gün). Silver katmanı kaynağın verdiği tarihi SESSİZCE
      değiştirmemelidir; Cuma'ya hizalama ayrı ve açıkça uygulanan bir kuraldır.
      KİMLİK NÜANSI: 5690 kaynağın sabit kalem kimliğidir ve seri kimliğinin
      dayanağıdır; 3 ise Toplam sütunudur. 1.0.4 yalnızca pozisyonel wire/chart
      adresidir, bülten düzeni değişince başka bir satırı gösterebilir ve kimlik
      olarak kullanılmaz. Ayrıca Takipteki Alacaklar altında aynı "a) Konut"
      etiketiyle farklı bir kalem (5867) bulunur; bu seri o değildir.
