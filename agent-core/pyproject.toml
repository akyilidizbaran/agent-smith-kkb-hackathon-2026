[project]
name = "kkb-agent"
version = "0.1.0"
description = "KKB Hackathon 2026 — Agentic Analytics Engine"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",       # sadece OpenAI-UYUMLU protokol istemcisi (Ollama + Kloudeks aynı arayüz)
    "pydantic>=2.9",
    "duckdb>=1.1",
    "pandas>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "truststore>=0.9",   # BDDK TLS: OS sertifika deposu, verify=False yerine
    "vl-convert-python>=1.9.0.post1",
    "scipy>=1.17.1",
    "pypdfium2>=5.13.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "lxml>=6.1.3",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kkb_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
