[project]
name = "kkb-agent"
version = "0.1.0"
description = "KKB Hackathon 2026 — Agentic Analytics Engine"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",       # sadece OpenAI-UYUMLU protokol istemcisi (Ollama + Kloudeks aynı arayüz)
    "pydantic>=2.9",
    "duckdb>=1.1",
    "pandas>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kkb_agent"]

[tool.ruff]
line-length = 100
