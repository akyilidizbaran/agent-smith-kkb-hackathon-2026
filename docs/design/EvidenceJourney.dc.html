<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=IBM+Plex+Mono&display=swap">
  <style>
    body { margin: 0; font-family: "Patrick Hand", "Comic Sans MS", cursive; color: #222; background: #fff; }
    @keyframes walk { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes glow { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .smith { offset-path: path("M 92 250 L 232 212 L 372 174 L 512 136 L 652 98"); offset-rotate: 0deg; animation: walk 8s linear infinite; }
    .link1 { animation: glow 8s linear infinite; animation-delay: 0s; }
    .link2 { animation: glow 8s linear infinite; animation-delay: 2s; }
    .link3 { animation: glow 8s linear infinite; animation-delay: 4s; }
    .link4 { animation: glow 8s linear infinite; animation-delay: 6s; }
  </style>
</helmet>
<div style="width: 720px; height: 450px; box-sizing: border-box; border: 2px solid #222; background: #fff; display: flex; flex-direction: column; gap: 6px; padding: 14px 18px;">
  <div style="display: flex; justify-content: space-between; align-items: baseline;">
    <div style="font-size: 20px;">Yön D · Kanıt yolculuğu (2,5B izometrik, canlı animasyon)</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #666;">kanıt panelinde "Yolculuğu izle" düğmesi → bu görünüm</div>
  </div>
  <svg viewBox="0 0 720 330" width="684" height="313" xmlns="http://www.w3.org/2000/svg" style="display: block;">
    <!-- zemin ızgarası -->
    <g stroke="#e6e2d8" stroke-width="1">
      <path d="M 40 300 L 300 160 M 100 320 L 360 180 M 160 330 L 420 190 M 220 330 L 480 190 M 280 330 L 540 190 M 340 330 L 600 190 M 400 330 L 660 190"/>
      <path d="M 40 300 L 420 330 M 120 256 L 500 286 M 200 212 L 580 242 M 280 168 L 660 198"/>
    </g>
    <!-- bağlantılar: yürüdükçe yanar -->
    <g stroke-width="4" stroke-linecap="round" fill="none">
      <path class="link1" d="M 92 250 L 232 212" stroke="#0f6b63"/>
      <path class="link2" d="M 232 212 L 372 174" stroke="#0f6b63"/>
      <path class="link3" d="M 372 174 L 512 136" stroke="#0f6b63"/>
      <path class="link4" d="M 512 136 L 652 98" stroke="#0f6b63"/>
    </g>
    <!-- düğümler: izometrik kutular -->
    <g font-family="IBM Plex Mono, monospace" font-size="11" fill="#222">
      <g transform="translate(92 250)"><path d="M -30 -14 L 0 -28 L 30 -14 L 0 0 Z" fill="#1f1d1a"/><path d="M -30 -14 L -30 6 L 0 20 L 0 0 Z" fill="#3a3733"/><path d="M 0 0 L 0 20 L 30 6 L 30 -14 Z" fill="#2a2724"/><text y="40" text-anchor="middle">Cevap · 678.970</text></g>
      <g transform="translate(232 212)"><path d="M -30 -14 L 0 -28 L 30 -14 L 0 0 Z" fill="#c9a227"/><path d="M -30 -14 L -30 6 L 0 20 L 0 0 Z" fill="#a8861f"/><path d="M 0 0 L 0 20 L 30 6 L 30 -14 Z" fill="#8a6e19"/><text y="40" text-anchor="middle">Tablo · SQL</text></g>
      <g transform="translate(372 174)"><path d="M -30 -14 L 0 -28 L 30 -14 L 0 0 Z" fill="#b8bcc4"/><path d="M -30 -14 L -30 6 L 0 20 L 0 0 Z" fill="#9096a0"/><path d="M 0 0 L 0 20 L 30 6 L 30 -14 Z" fill="#7a808a"/><text y="40" text-anchor="middle">Silver · 12 gözlem</text></g>
      <g transform="translate(512 136)"><path d="M -30 -14 L 0 -28 L 30 -14 L 0 0 Z" fill="#b87333"/><path d="M -30 -14 L -30 6 L 0 20 L 0 0 Z" fill="#96602a"/><path d="M 0 0 L 0 20 L 30 6 L 30 -14 Z" fill="#7a4e22"/><text y="40" text-anchor="middle">Bronze · artifact sha256</text></g>
      <g transform="translate(652 98)"><path d="M -30 -14 L 0 -28 L 30 -14 L 0 0 Z" fill="#e8e4da"/><path d="M -30 -14 L -30 6 L 0 20 L 0 0 Z" fill="#cfc9bb"/><path d="M 0 0 L 0 20 L 30 6 L 30 -14 Z" fill="#b8b1a2"/><text y="40" text-anchor="middle">RAW · bddk.org.tr · HTTP 200</text></g>
    </g>
    <!-- Smith: yolu yürüyen küçük karakter -->
    <g class="smith">
      <g style="animation: bob .6s ease-in-out infinite;">
        <ellipse cx="0" cy="-2" rx="9" ry="4" fill="#0002"/>
        <rect x="-7" y="-30" width="14" height="18" rx="4" fill="#0f6b63"/>
        <circle cx="0" cy="-36" r="8" fill="#f6f4ef" stroke="#1f1d1a" stroke-width="1.5"/>
        <circle cx="-3" cy="-37" r="1.4" fill="#1f1d1a"/><circle cx="3" cy="-37" r="1.4" fill="#1f1d1a"/>
        <path d="M -7 -18 L -12 -8 M 7 -18 L 12 -8" stroke="#0f6b63" stroke-width="3" stroke-linecap="round"/>
        <rect x="-11" y="-26" width="8" height="8" rx="1.5" fill="#fff8e8" stroke="#a35a00"/>
      </g>
    </g>
    <!-- konuşma balonu -->
    <g transform="translate(150 60)">
      <rect x="0" y="0" width="250" height="52" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="12" y="20" font-size="15">Smith her halkayı tek tek açıyor:</text>
      <text x="12" y="40" font-family="IBM Plex Mono, monospace" font-size="11" fill="#0f6b63">678.970 → satır 12 → obs 2025-12-31 → run 7417774b</text>
    </g>
  </svg>
  <div style="display: flex; gap: 14px; font-size: 13px; color: #444;">
    <div>• Tıklanan sayı → yolculuk o sayıdan başlar</div><div>• Kopuk halka: kırmızı, karakter durur</div><div>• Uygulama: SVG + CSS (offset-path); three.js yalnız "orbit" görünümü için opsiyon</div>
  </div>
</div>
</x-dc>
</body>
</html>
