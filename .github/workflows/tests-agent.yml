# Deterministik testler (M15-T09, ADR-0061). Ağ, MIA, Tavily ve EVDS gerektiren canlı koşular burada YOK:
# onlar anahtarlı ve bütçeli olarak elle çalıştırılır (make demo-data, scripts/run_golden.py, m02 benchmark).
#
# 17 Eyl: tek workflow ikiye bölündü ve yalnız pull_request'te koşuyor. Eskiden her push aynı commit için
# iki koşu (push + pull_request) başlatıyor ve ajan PR'ları da ~40 dk'lık lakehouse işini çalıştırıyordu;
# aylık Actions kotası bu yüzden tükendi. Her iş yalnız kendi paketi değişince koşar.
name: tests-agent
on:
  pull_request:
    paths:
      - "agent-core/**"
      - ".github/workflows/tests-agent.yml"
  workflow_dispatch:
concurrency:
  group: tests-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Kilitli kurulum
        working-directory: agent-core
        run: uv sync --frozen --extra dev
      - name: Birim ve sözleşme testleri
        working-directory: agent-core
        run: uv run --frozen --extra dev pytest -q -p no:cacheprovider
