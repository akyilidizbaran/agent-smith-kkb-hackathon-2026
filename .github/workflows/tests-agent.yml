# Deterministik testler (M15-T09, ADR-0061). Ağ, MIA, Tavily ve EVDS gerektiren canlı koşular burada YOK:
# onlar anahtarlı ve bütçeli olarak elle çalıştırılır (make demo-data, scripts/run_golden.py, m02 benchmark).
#
# 18 Eyl: repo Pro hesaba taşındı (3.000 dk/ay). Koşu yalnız agent-core değişince: PR'da ve main'e merge
# sonrası. Feature dalına push tek başına koşu başlatmaz (aynı commit için ikinci koşu israftı).
name: tests-agent
on:
  pull_request:
    paths:
      - "agent-core/**"
      - ".github/workflows/tests-agent.yml"
  push:
    branches: ["main"]
    paths:
      - "agent-core/**"
      - ".github/workflows/tests-agent.yml"
  workflow_dispatch:
concurrency:
  group: tests-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Kilitli kurulum
        working-directory: agent-core
        run: uv sync --frozen --extra dev
      - name: Birim ve sözleşme testleri
        working-directory: agent-core
        run: uv run --frozen --extra dev pytest -q -p no:cacheprovider
