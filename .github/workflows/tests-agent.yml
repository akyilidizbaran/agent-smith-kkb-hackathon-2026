# Deterministik testler (M15-T09, ADR-0061). Ağ, MIA, Tavily ve EVDS gerektiren canlı koşular burada YOK:
# onlar anahtarlı ve bütçeli olarak elle çalıştırılır (make demo-data, scripts/run_golden.py, m02 benchmark).
#
# 17 Eyl: tek workflow ikiye bölündü. Aylık Actions kotası tükendi ve açılmayacak; bu yüzden hiçbir iş
# PR'da otomatik koşmuyor, yalnız elle tetikleniyor. Ajan ve veri testleri PR'dan önce yerelde koşulur,
# sonuç PR gövdesine yazılır: docs/PR_ONCESI_TEST.md. Kota bir gün açılırsa pull_request bloğu açılır.
name: tests-agent
on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - "agent-core/**"
  #     - ".github/workflows/tests-agent.yml"
concurrency:
  group: tests-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Kilitli kurulum
        working-directory: agent-core
        run: uv sync --frozen --extra dev
      - name: Birim ve sözleşme testleri
        working-directory: agent-core
        run: uv run --frozen --extra dev pytest -q -p no:cacheprovider
