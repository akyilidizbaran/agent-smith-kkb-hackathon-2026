# Deterministik testler (M15-T09, ADR-0061). Ağ ve EVDS gerektiren canlı koşular burada YOK.
#
# 18 Eyl: GitHub Actions kotası yeniden kullanılabilir durumda; lakehouse testi PR açılınca ve elle çalışır.
# Yerel sonuçlar yine docs/PR_ONCESI_TEST.md içinde tutulur, ancak merge kararı CI sonucuna dayanır.
#
# Elle tetiklemeden önce: paket 1,9k katalogla GitHub'da 36–47 dk sürdü; 6,7k katalogla (PR #9 sonrası)
# 60 dk sınırına yakın, iptal olursa kota boşa gider. Süre: lakehouse-core/src/lakehouse/catalog/series.py
# (_YAML_LOADER) ve testlerin her bootstrap'ta kataloğu baştan yüklemesine bağlı.
name: tests-lakehouse
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lakehouse-core/**"
      - ".github/workflows/tests-lakehouse.yml"
concurrency:
  group: tests-lakehouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lakehouse-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Kilitli kurulum
        working-directory: lakehouse-core
        run: uv sync --frozen
      - name: Testler
        working-directory: lakehouse-core
        run: uv run --frozen pytest -q -p no:cacheprovider
