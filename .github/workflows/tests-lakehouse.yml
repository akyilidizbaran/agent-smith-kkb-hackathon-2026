# Deterministik testler (M15-T09, ADR-0061). Ağ ve EVDS gerektiren canlı koşular burada YOK.
#
# 18 Eyl: repo Pro hesaba taşındı (3.000 dk/ay). Koşu yalnız lakehouse-core değişince: PR'da ve main'e merge
# sonrası. 1,9k katalog için dengelenen A/B/C parçaları 6,7k katalogda 60 dk sınırına dayandı; A ve C kesildi.
# Sekiz daha küçük parça kullanılır; katalog/DB kurulumunu yoğun kullanan dizinler ayrı tutulur.
# Yeni bir tests/<dizin> eklenirse "Parça kapsamı" adımı kırılır: dizin bir parçaya yazılmalı.
name: tests-lakehouse
on:
  pull_request:
    paths:
      - "lakehouse-core/**"
      - ".github/workflows/tests-lakehouse.yml"
  push:
    branches: ["main"]
    paths:
      - "lakehouse-core/**"
      - ".github/workflows/tests-lakehouse.yml"
  workflow_dispatch:
concurrency:
  group: tests-lakehouse-${{ github.ref }}
  cancel-in-progress: true
env:
  SHARD_A: tests/acceptance tests/cli tests/scripts tests/security
  SHARD_B: tests/adhoc
  SHARD_C: tests/catalog tests/infrastructure
  SHARD_D: tests/connectors tests/contract
  SHARD_E: tests/generic
  SHARD_F: tests/gold
  SHARD_G: tests/ingestion tests/integration
  SHARD_H: tests/parsers tests/silver
jobs:
  lakehouse-core:
    name: lakehouse-core (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [A, B, C, D, E, F, G, H]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Parça kapsamı (her tests/<dizin> tam bir parçada)
        working-directory: lakehouse-core
        shell: bash
        run: |
          all="$SHARD_A $SHARD_B $SHARD_C $SHARD_D $SHARD_E $SHARD_F $SHARD_G $SHARD_H"
          missing=""
          for d in tests/*/; do
            d="${d%/}"
            case "$d" in tests/__pycache__) continue;; esac
            ls "$d"/test_*.py "$d"/*/test_*.py >/dev/null 2>&1 || continue
            case " $all " in *" $d "*) ;; *) missing="$missing $d";; esac
          done
          if [ -n "$missing" ]; then
            echo "::error::Hiçbir parçada olmayan test dizini:$missing — tests-lakehouse.yml içindeki SHARD_* listesine ekleyin"
            exit 1
          fi
      - name: Kilitli kurulum
        working-directory: lakehouse-core
        run: uv sync --frozen
      - name: Testler
        working-directory: lakehouse-core
        shell: bash
        run: |
          case "${{ matrix.shard }}" in
            A) dirs="$SHARD_A";; B) dirs="$SHARD_B";; C) dirs="$SHARD_C";; D) dirs="$SHARD_D";;
            E) dirs="$SHARD_E";; F) dirs="$SHARD_F";; G) dirs="$SHARD_G";; H) dirs="$SHARD_H";;
          esac
          uv run --frozen pytest -q --durations=20 -p no:cacheprovider $dirs
