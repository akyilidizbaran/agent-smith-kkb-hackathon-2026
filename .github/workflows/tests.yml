# Deterministik testler (M15-T09, ADR-0061). Ağ, MIA, Tavily ve EVDS gerektiren canlı koşular burada YOK:
# onlar anahtarlı ve bütçeli olarak elle çalıştırılır (make demo-data, scripts/run_golden.py, m02 benchmark).
name: tests
on:
  push:
    branches: ["feature/**"]
  pull_request:
  workflow_dispatch:
# Aynı dala art arda push'ta eski koşu iptal edilir; lakehouse işi ~13–25 dk sürdüğü için kuyruk birikiyordu.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Kilitli kurulum
        working-directory: agent-core
        run: uv sync --frozen --extra dev
      - name: Birim ve sözleşme testleri
        working-directory: agent-core
        run: uv run --frozen --extra dev pytest -q -p no:cacheprovider
  lakehouse-core:
    runs-on: ubuntu-latest
    # Ölçüldü 14 Eyl: yerelde 12 dk, GitHub koşucusunda 34 dk; 40 dk sınırı bir koşuyu iptal ettirdi.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Kilitli kurulum
        working-directory: lakehouse-core
        run: uv sync --frozen
      - name: Testler
        working-directory: lakehouse-core
        run: uv run --frozen pytest -q -p no:cacheprovider
